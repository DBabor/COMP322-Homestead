<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri-Tech</title>
    <meta name="description" content="A homstead-farm manager integrating crop cycles and weather api">
    <meta name="keywords" content="Farming, homestead, data">
    <meta name="author" content="Dillon Babor">

    <link rel="stylesheet" href="style.css" />
</head>
<header>
    <h1>Agri-Tech</h1>
</header>

<body>

    <!-- Weather Widget -->
    <a class="weatherwidget-io" href="https://forecast7.com/en/40d71n74d01/new-york/" data-label_1="NEW YORK"
        data-label_2="WEATHER" data-theme="original">NEW YORK WEATHER</a>
    <script>
        !function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (!d.getElementById(id)) { js = d.createElement(s); js.id = id; js.src = 'https://weatherwidget.io/js/widget.min.js'; fjs.parentNode.insertBefore(js, fjs); } }(document, 'script', 'weatherwidget-io-js');
    </script>

    <aside class="croptable">
        <ul id="cropdata">
            <li>Crop</li>
            <li>Growth Time (days)</li>
            <li>Yield (lbs)</li>
            <li>Frost Susceptible</li>
            <li>Drought Susceptible</li>
        </ul>
    </aside>

    <section class="form">
        <form id="cropform">
            <!-- Crop Input -->
            <label for="croplabel">Crop Name:</label>
            <input type="text" id="cropname" name="cropname">

            <!-- Growth Input -->
            <label for="growthlabel">Growth Time (days):</label>
            <input type="text" id="growthtime" name="growthtime">

            <!-- Crop Yield -->
            <label for="yieldlabel">Crop Yield (lbs):</label>
            <input type="text" id="cropyield" name="cropyield">

            <!-- Frost Susceptibility Input -->
            <label for="frostlabel">Frost Susceptible:</label>
            <input type="radio" id="frostyes" name="frostsusceptible">
            <label for="yes">Yes</label>
            <input type="radio" id="frostno" name="frostsusceptible">
            <label for="no">No</label>

            <!-- Drought Susceptibility Input -->
            <label for="droughtlabel">Drought Susceptible:</label>
            <input type="radio" id="droughtyes" name="droughtsusceptible">
            <label for="yes">Yes</label>
            <input type="radio" id="droughtno" name="droughtsusceptible">
            <label for="no">No</label>

            <input type="submit" value="Submit">
        </form>
    </section>

</body>

</html>
